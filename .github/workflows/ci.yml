name: CI

on:
  pull_request:
  push:
    branches: [claude/modest-franklin-rS4UU, claude/magical-ritchie-xhR1M, main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # valores fictícios — o build não conecta ao banco (páginas são dinâmicas)
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      AUTH_SECRET: "ci-dummy-secret-please-change-in-production-32"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
